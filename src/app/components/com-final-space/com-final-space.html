<div class="content" *ngIf="charactersPage; else elseBlock">
    <div id="header">
        <h1>Rick & Morty Character List</h1>
        <div class="pagination">
            <button (click)="prevPage()" [disabled]="currentPage === 1">PrevPage</button>
            <span>page{{currentPage}} / {{totalPages}}</span>
            <button (click)="nextPage()" [disabled]="currentPage=== totalPages">NextPage</button> <br>
            Go to: <input type="number" [(ngModel)]="pageToGo"><button (click)="goToPage(pageToGo)">Go to</button>

        </div>
        Character name: <input type="text" [(ngModel)]="charName" />
        <button (click)="filterByName()">Filter by name</button>
        <button (click)="resetFilter()">Reset Filter</button>
        <button (click)="orderByName()">Order by name</button>
    </div>

    <!-- <p>Name of the first charater: {{dataApi.results[0].name}}.</p> -->
    <div class="card" *ngFor="let char of charactersPage; index as i">
        <div class="card-header">
            <h3>{{char.name}}.</h3>
        </div>
        <img [src]="char.img_url" [title]="char.name" />
        <p><b>Status:</b>{{char.status}}</p>
        <p><b>Species:</b>{{char.species}}</p>
        <p><b>Gender:</b>{{char.gender}}</p>
        <p><b>Hair:</b>{{char.hair}}</p>
        <p><b>Origin:</b>{{char.origin}}</p>


        <button (click)="toggleAccordionAlias(i)">Alias</button>

        <div *ngIf="activeIndexAlias === i" class="accordion-content">
            <ul>
                <li *ngFor="let alias of char.alias">
                    <p>{{alias}}</p>
                </li>
            </ul>
            <button (click)="toggleAccordionAlias(i)">Close</button>
        </div>

        <button (click)="toggleAccordionAbilities(i)">Abilities</button>

        <div *ngIf="activeIndexAbility === i" class="accordion-content">
            <ul>
                <li *ngFor="let ability of char.abilities">
                    <p>{{ability}}</p>
                </li>
            </ul>
            <button (click)="toggleAccordionAbilities(i)">Close</button>

        </div>

    </div>
    
</div>
<ng-template #elseBlock>
    <div class="content">

        <span class="loader"></span>
    </div>
</ng-template>
